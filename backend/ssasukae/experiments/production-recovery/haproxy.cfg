global
    log stdout format raw local0
    maxconn 512

defaults
    log global
    mode http
    option httplog
    timeout connect 1s
    timeout client 30s
    timeout server 30s
    timeout tunnel 60s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 1s

frontend gateway
    bind :8080
    default_backend apps

backend apps
    # Deterministically use A while it is healthy; B is alive and eligible throughout.
    balance first
    option httpchk
    http-check send meth GET uri /experiment/ready ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    http-response set-header X-Backend-Instance %[srv_name]
    server a a:8080 check inter 200ms fall 2 rise 2 resolvers docker init-addr libc,none
    server b b:8080 check inter 200ms fall 2 rise 2 resolvers docker init-addr libc,none

listen statistics
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 1s

frontend secondary_control
    bind :8081
    default_backend secondary

backend secondary
    server b b:8080 check inter 200ms resolvers docker init-addr libc,none
