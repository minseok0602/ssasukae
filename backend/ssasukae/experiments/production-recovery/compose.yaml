name: ssasukae-production-recovery
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: card_experiment
      MYSQL_USER: experiment
      MYSQL_PASSWORD: experiment-local-only
      MYSQL_ROOT_PASSWORD: experiment-root-local-only
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost, -uroot, -pexperiment-root-local-only]
      interval: 1s
      timeout: 3s
      retries: 90
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
  a: &backend
    image: ssasukae-production-verification:local
    working_dir: /experiment
    command: [java, '-XX:TieredStopAtLevel=1', '-Xms128m', '-Xmx512m', '-cp', '/runtime/classes:/runtime/lib/*', experiment.ProductionVerificationApplication, '--spring.config.location=file:/experiment/application-verification.properties']
    volumes: ['.:/experiment']
    environment:
      INSTANCE: A
      EXPERIMENT_RECOVERY_ENABLED: ${RECOVERY_ENABLED:-true}
      CARD_RECOVERY_ENABLED: ${A_RECOVERY_ENABLED:-true}
      WEBSOCKET_RELAY_ENABLED: true
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_started}
  b:
    <<: *backend
    environment:
      INSTANCE: B
      EXPERIMENT_RECOVERY_ENABLED: ${RECOVERY_ENABLED:-true}
      CARD_RECOVERY_ENABLED: ${RECOVERY_ENABLED:-true}
      WEBSOCKET_RELAY_ENABLED: true
  lb:
    image: haproxy:3.2-alpine
    volumes: ['./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro']
    ports: ['127.0.0.1:18190:8080', '127.0.0.1:18191:8404', '127.0.0.1:18192:8081']
    depends_on: [a, b]
volumes:
  mysql-data:
  redis-data:
